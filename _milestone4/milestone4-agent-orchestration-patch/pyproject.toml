[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bpmn-agentic-engineer"
version = "0.1.0"
description = "A safe, tool-driven foundation for a natural-language BPMN engineering agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "BPMN Agentic Engineering Project" }
]
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp[cli]>=2,<3"
]
agent = [
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2"
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11"
]
all = [
  "mcp[cli]>=2,<3",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11"
]

[project.scripts]
bpmn-agent = "bpmn_agentic_engineer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpmn_agentic_engineer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
